<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b141a">
<title>Axo — Money is a conversation</title>
<style>
  :root{
    /* WhatsApp light palette */
    --wa-bg:#efe7de;            /* cream chat wallpaper */
    --wa-header:#f0f2f5;        /* light header */
    --wa-in:#ffffff;            /* incoming bubble (white) */
    --wa-out:#d9fdd3;           /* outgoing bubble (light green) */
    --wa-panel:#f0f2f5;         /* composer bar bg */
    --wa-field:#ffffff;         /* input / field bg */
    --axo:#00a884;             /* WhatsApp teal-green accent */
    --axo-deep:#008069;
    --txt:#111b21;             /* near-black text */
    --txt-dim:#667781;         /* muted grey */
    --danger:#e0483d;--warn:#c9821a;
    --line:rgba(0,0,0,.08);
    --card:#ffffff;
    --font:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  html,body{margin:0;height:100%;overflow-x:hidden;max-width:100vw}
  body{font-family:var(--font);background:#000;color:var(--txt);display:flex;align-items:center;justify-content:center;min-height:100dvh;width:100%}
  .phone{width:100%;max-width:420px;height:100dvh;max-height:900px;background:var(--wa-bg);display:flex;flex-direction:column;position:relative;overflow:hidden;margin:0 auto}
  @media(min-width:440px){.phone{border-radius:28px;box-shadow:0 24px 80px rgba(0,0,0,.6);border:1px solid #1a1a1a}}
  .chat{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 10px 6px;background-color:#efe7de;background-image:url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23d9cfc4' fill-opacity='0.32'%3E%3Ccircle cx='20' cy='20' r='2'/%3E%3Ccircle cx='60' cy='45' r='1.5'/%3E%3Ccircle cx='85' cy='75' r='2'/%3E%3Ccircle cx='40' cy='80' r='1.5'/%3E%3C/g%3E%3C/svg%3E");background-size:120px 120px;scroll-behavior:smooth}
  .chat::-webkit-scrollbar{width:0}
  .hdr{background:var(--wa-header);padding:10px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);z-index:5}
  .hdr .back{color:#008069;font-size:20px;width:22px}
  .hdr .ava{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--axo),var(--axo-deep));display:grid;place-items:center;font-weight:800;color:#fff;font-size:14px;position:relative}
  .hdr .ava .v{position:absolute;right:-2px;bottom:-2px;width:14px;height:14px;border-radius:50%;background:#25d366;border:2px solid var(--wa-header);display:grid;place-items:center;font-size:7px;color:#fff}
  .hdr .who{flex:1;line-height:1.2}.hdr .who b{font-size:15px;font-weight:600;color:var(--txt)}.hdr .who span{font-size:11px;color:var(--txt-dim);display:block}
  .hdr .ico{color:#54656f;font-size:17px;width:20px;text-align:center}
  .row{display:flex;margin:3px 0;animation:pop .22s ease;max-width:100%}.row.in{justify-content:flex-start}.row.out{justify-content:flex-end}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .bub{max-width:80%;width:fit-content;min-width:0;padding:8px 13px 7px;border-radius:10px;font-size:14.5px;line-height:1.45;position:relative;box-shadow:0 1px .5px rgba(0,0,0,.13);word-wrap:break-word;overflow-wrap:anywhere;color:var(--txt)}
  .row.in .bub{background:var(--wa-in);border-top-left-radius:2px}
  .row.out .bub{background:var(--wa-out);border-top-right-radius:2px}
  .bub .t{font-size:10.5px;color:var(--txt-dim);float:right;margin:3px 0 -2px 6px;position:relative;top:5px;white-space:nowrap}.row.out .bub .t{color:#667781}
  .bub b{font-weight:600}.tick{color:#53bdeb;font-size:11px;margin-left:2px}
  .bub .sp{display:inline-block;width:46px;height:1px}.bub.o .sp{width:60px}
  .sys{align-self:center;background:#fcf5d8;color:#54656f;font-size:11px;padding:5px 12px;border-radius:8px;margin:8px auto;text-align:center;max-width:82%;box-shadow:0 1px .5px rgba(0,0,0,.1)}
  .acts{display:flex;flex-direction:column;gap:1px;margin:1px 0 6px;max-width:82%;animation:pop .25s ease}
  .acts.center{align-self:center;max-width:88%;width:88%}
  .act{background:var(--wa-in);color:var(--axo);border:none;border-top:1px solid var(--line);padding:12px;font-size:14.5px;font-weight:600;font-family:var(--font);display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:background .12s}
  .act:first-child{border-top:none;border-radius:9px 9px 0 0}.act:last-child{border-radius:0 0 9px 9px}.act:only-child{border-radius:9px}
  .act:active{background:#f2f5f7}.act .g{font-size:15px}.act.dim{color:var(--txt-dim)}
  .card{background:var(--wa-in);border-radius:10px;overflow:hidden;max-width:88%;margin:3px 0 6px;animation:pop .25s ease;border:1px solid var(--line);box-shadow:0 1px .5px rgba(0,0,0,.1)}
  .card.wide{width:88%}
  .card-h{padding:11px 13px;background:#f0f7f4;color:var(--axo-deep);border-bottom:1px solid var(--line);font-weight:700;font-size:13px;display:flex;align-items:center;gap:8px}
  .card-b{padding:8px 13px 12px}
  .bal-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
  .bal-row:last-child{border-bottom:none}
  .bal-ico{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;flex:none}
  .b-usd{background:#2e7d5b}.b-usdc{background:#2775ca}.b-usdt{background:#26a17b}.b-kes{background:#b5651d}.b-sos{background:#4a76c4}
  .bal-name{flex:1;font-size:13px}.bal-name span{display:block;font-size:10.5px;color:var(--txt-dim)}
  .bal-amt{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
  .bal-total{margin-top:8px;padding-top:9px;border-top:1px dashed var(--line);display:flex;justify-content:space-between;align-items:baseline}
  .bal-total b{font-size:19px}.bal-total small{color:var(--txt-dim);font-size:11px}
  .recpt{font-size:13px}.recpt .rr{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line)}
  .recpt .rr:last-child{border-bottom:none}.recpt .rr span:first-child{color:var(--txt-dim);flex:none}
  .recpt .rr span:last-child{font-weight:600;text-align:right}.recpt .big{font-size:17px}
  .stamp{display:inline-flex;align-items:center;gap:6px;margin-top:4px;color:var(--axo-deep);font-weight:700;font-size:14px}
  .contact-pick{display:flex;align-items:center;gap:11px;padding:9px 3px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s;border-radius:6px}
  .contact-pick:active{background:#f2f5f7}.contact-pick:last-child{border-bottom:none}
  .cp-ava{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;font-size:14px;flex:none}
  .cp-name{flex:1;font-size:14px}.cp-name span{display:block;font-size:11px;color:var(--txt-dim)}
  .cp-arrow{color:var(--txt-dim)}
  .typing{display:flex;gap:3px;padding:11px 12px}
  .typing i{width:7px;height:7px;border-radius:50%;background:var(--txt-dim);animation:blink 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}
  .bar{background:var(--wa-panel);padding:7px 9px;display:flex;align-items:flex-end;gap:7px;border-top:1px solid var(--line)}
  .bar .field{flex:1;background:var(--wa-field);border-radius:22px;display:flex;align-items:center;padding:9px 14px;gap:9px;min-height:44px;box-shadow:0 1px .5px rgba(0,0,0,.08)}
  .bar .field input{flex:1;background:none;border:none;outline:none;color:var(--txt);font-size:14.5px;font-family:var(--font)}
  .bar .field input::placeholder{color:var(--txt-dim)}.bar .field .emo{color:var(--txt-dim);font-size:19px}
  .bar .send{width:44px;height:44px;border-radius:50%;flex:none;border:none;cursor:pointer;background:var(--axo);color:#fff;font-size:19px;display:grid;place-items:center;transition:transform .1s}
  .bar .send:active{transform:scale(.9)}
  /* amount pad (send) */
  .amtwrap{background:var(--wa-in);border-radius:10px;padding:12px;max-width:88%;width:88%;margin:3px 0 6px;border:1px solid var(--line);animation:pop .25s ease;box-shadow:0 1px .5px rgba(0,0,0,.1)}
  .amt-lbl{font-size:11px;color:var(--txt-dim);margin-bottom:4px}
  .amt-disp{font-size:30px;font-weight:800;text-align:center;padding:6px 0;font-variant-numeric:tabular-nums}
  .amt-disp small{font-size:14px;color:var(--txt-dim);font-weight:600}
  .asset-tabs{display:flex;gap:6px;margin:8px 0}
  .asset-tab{flex:1;text-align:center;padding:8px;border-radius:8px;background:#f0f2f5;font-size:12px;font-weight:700;cursor:pointer;color:var(--txt-dim);border:1px solid transparent;transition:.12s}
  .asset-tab.on{background:rgba(0,168,132,.12);color:var(--axo-deep);border-color:var(--axo)}
  .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
  .key{background:#f0f2f5;border:none;color:var(--txt);font-size:19px;font-weight:600;padding:12px 0;border-radius:9px;cursor:pointer;font-family:var(--font);transition:background .1s}.key:active{background:#e2e6ea}
  .amt-go{width:100%;margin-top:9px;background:var(--axo);color:#fff;border:none;padding:13px;border-radius:9px;font-size:15px;font-weight:700;cursor:pointer;font-family:var(--font)}
  .amt-go:disabled{background:#e2e6ea;color:#9aa6b0}
  .amt-err{color:var(--danger);font-size:11.5px;text-align:center;margin-top:6px;min-height:14px}
  /* transaction auth PIN */
  .txauth-hint{font-size:12.5px;color:var(--txt-dim);text-align:center;margin:4px 0 10px}
  .txpin{display:flex;justify-content:center;gap:11px;margin:6px 0 4px}
  .txpin span{width:14px;height:14px;border-radius:50%;background:#e2e6ea;border:1.5px solid #cfd6db;transition:.15s}
  .txpin span.on{background:var(--axo);border-color:var(--axo)}
  .txpin.ok span{background:var(--axo);border-color:var(--axo)}
  .txpin.shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  .txauth-err{color:var(--danger);font-size:11.5px;text-align:center;min-height:15px;margin:2px 0}
  .txauth-note{font-size:10.5px;color:var(--txt-dim);text-align:center;margin-top:8px;line-height:1.4}
  /* app lock screen */
  .lockscreen{position:absolute;inset:0;background:linear-gradient(180deg,#008069,#00a884);z-index:80;display:none;flex-direction:column;align-items:center;justify-content:center;padding:30px;color:#fff}
  .lockscreen.on{display:flex}
  .lock-logo{width:72px;height:72px;border-radius:20px;background:rgba(255,255,255,.15);display:grid;place-items:center;font-size:34px;font-weight:800;margin-bottom:18px;backdrop-filter:blur(4px)}
  .lock-title{font-size:22px;font-weight:800;margin-bottom:4px}
  .lock-sub{font-size:13.5px;opacity:.85;margin-bottom:26px;text-align:center}
  .lock-pin{display:flex;gap:13px;margin-bottom:18px}
  .lock-pin span{width:15px;height:15px;border-radius:50%;background:rgba(255,255,255,.25);transition:.15s}
  .lock-pin span.on{background:#fff}
  .lock-pin.shake{animation:shake .4s}
  .lock-keys{display:grid;grid-template-columns:repeat(3,64px);gap:14px;margin-top:6px}
  .lock-key{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.14);border:none;color:#fff;font-size:24px;font-weight:600;cursor:pointer;font-family:var(--font);transition:background .12s}
  .lock-key:active{background:rgba(255,255,255,.3)}
  .lock-key.blank{background:none;cursor:default}
  .lock-bio{margin-top:20px;background:rgba(255,255,255,.16);border:none;color:#fff;padding:12px 22px;border-radius:24px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font);display:flex;align-items:center;gap:8px}
  .lock-err{min-height:18px;font-size:12.5px;margin-top:10px;opacity:.95}
  /* fundraiser / donations */
  .fund-card{background:var(--wa-in);border:1px solid var(--line);border-radius:12px;overflow:hidden;max-width:88%;width:88%;margin:3px 0 6px;box-shadow:0 1px .5px rgba(0,0,0,.1);animation:pop .25s ease}
  .fund-banner{padding:14px;background:linear-gradient(135deg,#0e8a52,#00a884);color:#fff}
  .fund-banner .fb-cause{font-size:16px;font-weight:800}
  .fund-banner .fb-org{font-size:11.5px;opacity:.9;margin-top:2px}
  .fund-body{padding:12px 14px}
  .fund-prog{height:9px;border-radius:6px;background:#e9edef;overflow:hidden;margin:2px 0 7px}
  .fund-prog i{display:block;height:100%;background:linear-gradient(90deg,#00a884,#0e8a52);border-radius:6px;transition:width .5s}
  .fund-stats{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px}
  .fund-stats b{font-variant-numeric:tabular-nums}
  .fund-raised{font-size:19px;font-weight:800;color:var(--axo-deep)}
  .fund-target{font-size:12px;color:var(--txt-dim)}
  .fund-status{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;margin-top:2px}
  .fs-pending{background:rgba(232,184,75,.16);color:#c9821a}
  .fs-approved,.fs-active{background:rgba(0,168,132,.14);color:var(--axo-deep)}
  .fs-rejected,.fs-closed{background:rgba(224,72,61,.13);color:var(--danger)}
  .fs-completed{background:rgba(39,117,202,.13);color:#2775ca}
  .fund-review{background:#fff8e6;border:1px solid #f0e2b8;border-radius:10px;padding:11px 13px;font-size:12.5px;color:#7a6320;margin:4px 0}
  /* shop ordering */
  .shop-hd{background:var(--wa-in);border:1px solid var(--line);border-radius:12px;overflow:hidden;max-width:88%;width:88%;margin:3px 0 6px;box-shadow:0 1px .5px rgba(0,0,0,.1);animation:pop .25s ease}
  .shop-banner{padding:14px;background:linear-gradient(135deg,#0e8a52,#00a884);color:#fff}
  .shop-banner .sb-n{font-size:16px;font-weight:800;display:flex;align-items:center;gap:6px}
  .shop-banner .sb-vb{font-size:12px}
  .shop-banner .sb-d{font-size:11.5px;opacity:.92;margin-top:2px}
  .shop-banner .sb-open{display:inline-block;font-size:10.5px;background:rgba(255,255,255,.2);padding:2px 9px;border-radius:20px;margin-top:6px}
  .shop-cat{font-size:11px;font-weight:700;color:var(--txt-dim);letter-spacing:.4px;text-transform:uppercase;margin:10px 2px 2px;display:flex;align-items:center;gap:6px}
  .shop-item{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
  .shop-item:last-child{border-bottom:none}
  .shop-item .si-m{flex:1;min-width:0}
  .shop-item .si-t{font-size:14px;font-weight:600}
  .shop-item .si-s{font-size:11.5px;color:var(--txt-dim);margin-top:2px;line-height:1.35}
  .shop-item .si-p{font-size:13.5px;font-weight:700;margin-top:4px}
  .shop-item .si-img{width:58px;height:58px;border-radius:10px;flex:none;background:#e9edef center/cover;display:grid;place-items:center;font-size:24px}
  .shop-item .si-add{background:var(--axo);color:#fff;border:none;border-radius:8px;width:30px;height:30px;font-size:18px;cursor:pointer;font-family:var(--font);flex:none;align-self:center}
  .shop-item .si-qty{display:flex;align-items:center;gap:8px;align-self:center}
  .shop-item .si-qty button{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--wa-field);font-size:15px;cursor:pointer;font-family:var(--font)}
  .shop-item .si-qty span{font-size:14px;font-weight:700;min-width:16px;text-align:center}
  .cart-bar{position:sticky;bottom:0;background:var(--axo);color:#fff;border-radius:11px;padding:12px 15px;display:flex;align-items:center;justify-content:space-between;margin:8px 0 2px;cursor:pointer;box-shadow:0 4px 16px rgba(0,168,132,.3)}
  .cart-bar .cb-n{font-size:12.5px;font-weight:600}
  .cart-bar .cb-t{font-size:15px;font-weight:800}
  /* ===== WhatsApp send SIMULATOR (demo only — no real messages) ===== */
  .wa-toast{position:absolute;left:50%;bottom:80px;transform:translateX(-50%) translateY(20px);background:#111b21;color:#fff;border-radius:12px;padding:11px 15px;display:flex;align-items:center;gap:11px;box-shadow:0 10px 40px rgba(0,0,0,.4);z-index:60;opacity:0;transition:.35s cubic-bezier(.2,.8,.2,1);width:88%;max-width:340px;pointer-events:none}
  .wa-toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .wa-toast .wt-ic{width:34px;height:34px;border-radius:9px;background:#25d366;display:grid;place-items:center;font-size:18px;flex:none}
  .wa-toast .wt-m{flex:1;min-width:0}
  .wa-toast .wt-t{font-size:12.5px;font-weight:700;line-height:1.3}
  .wa-toast .wt-s{font-size:11px;color:#8696a0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wa-toast .wt-tick{color:#53bdeb;font-size:13px;flex:none}
  /* incoming WhatsApp notification banner (demo) */
  .wa-notif{position:absolute;top:8px;left:50%;transform:translateX(-50%) translateY(-120%);width:94%;max-width:380px;background:#fff;color:#111b21;border-radius:14px;padding:10px 13px;display:flex;gap:11px;align-items:flex-start;box-shadow:0 12px 40px rgba(0,0,0,.28);z-index:70;transition:.4s cubic-bezier(.2,.8,.2,1)}
  .wa-notif.on{transform:translateX(-50%) translateY(0)}
  .wa-notif .wn-ic{width:38px;height:38px;border-radius:9px;background:#25d366;display:grid;place-items:center;font-size:20px;flex:none}
  .wa-notif .wn-m{flex:1;min-width:0}
  .wa-notif .wn-top{display:flex;justify-content:space-between;align-items:center}
  .wa-notif .wn-app{font-size:10.5px;font-weight:700;color:#25d366;letter-spacing:.3px;text-transform:uppercase}
  .wa-notif .wn-time{font-size:10.5px;color:#8696a0}
  .wa-notif .wn-title{font-size:13.5px;font-weight:700;margin-top:1px}
  .wa-notif .wn-body{font-size:12.5px;color:#3b4a54;line-height:1.4;margin-top:1px;white-space:pre-wrap}
  .wa-notif .wn-demo{position:absolute;top:4px;right:8px;font-size:8px;color:#c0c7cc;font-weight:700}
  /* convert panel */
  .assets{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:4px 0}
  .apick{display:flex;align-items:center;gap:9px;background:var(--wa-field);border:1px solid transparent;border-radius:10px;padding:9px;cursor:pointer;transition:.12s}
  .apick:active,.apick.on{border-color:var(--axo);background:rgba(37,181,115,.12)}
  .apick .ai{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;font-size:10px;flex:none}
  .apick .an{font-size:13px;font-weight:600;line-height:1.15}.apick .an small{display:block;font-weight:400;font-size:10px;color:var(--txt-dim)}
  .cv{background:var(--wa-in);border:1px solid var(--line);border-radius:10px;padding:12px;max-width:90%;width:90%;margin:3px 0 6px;animation:pop .25s ease}
  .cv-leg{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--txt-dim);margin-bottom:2px}
  .cv-swap{width:30px;height:30px;border-radius:50%;background:var(--wa-field);border:none;color:var(--axo);font-size:15px;display:grid;place-items:center;margin:4px auto;cursor:pointer;transition:transform .2s}.cv-swap:active{transform:rotate(180deg)}
  .cv-disp{font-size:26px;font-weight:800;text-align:center;padding:2px 0;font-variant-numeric:tabular-nums}
  .cv-disp small{font-size:14px;color:var(--txt-dim);font-weight:600}
  .cv-get{text-align:center;font-size:13px;color:var(--txt-dim);margin-top:2px}.cv-get b{color:var(--axo);font-size:20px;font-variant-numeric:tabular-nums}
  .rate-line{display:flex;justify-content:space-between;font-size:11.5px;color:var(--txt-dim);margin-top:9px;padding-top:9px;border-top:1px dashed var(--line)}
  .rate-line.fx b{color:var(--warn)}
  .quote-timer{font-size:11px;color:var(--warn);text-align:center;margin-top:6px}
  .qr-wrap{text-align:center;padding:6px 0 2px}
  .qr{width:150px;height:150px;margin:6px auto;background:#fff;border-radius:12px;padding:9px;display:grid;grid-template-columns:repeat(11,1fr);grid-template-rows:repeat(11,1fr);gap:1px}

<script>
const chat=document.getElementById('chat'), txt=document.getElementById('txt');

/* ===== SIMULATOR BRIDGE (only active when embedded in the split-screen simulator) =====
   Lets a sender instance and a receiver instance reflect each other. Harmless when
   run standalone (no parent listens). Does not change any existing behaviour. */
const AXO_PEER = (window.parent && window.parent!==window);
function axoEmit(type, payload){
  try{ if(AXO_PEER) window.parent.postMessage({__axo:true, type, payload}, '*'); }catch(e){}
}
window.addEventListener('message', ev=>{
  const d=ev.data; if(!d||!d.__axo) return;
  if(d.type==='incoming-payment') onIncomingFromPeer(d.payload);
  else if(d.type==='incoming-request') onIncomingRequestFromPeer(d.payload);
});
/* a payment sent by the OTHER phone lands here as a real credit */
async function onIncomingFromPeer(p){
  if(!S || !S.verified) return; // must be onboarded to receive
  const asset=p.asset||'USD';
  S.bal[asset]=+((S.bal[asset]||0)+p.amount).toFixed(2);
  // surface it in the thread like a real received payment
  if(typeof inBub==='function'){
    const sym=asset==='USD'?'$':'', suf=asset!=='USD'?' '+asset:'';
    await typing(500);
    inBub(`🔔 <b>Money received!</b>`);
    const c=document.createElement('div');c.className='card wide';
    c.innerHTML=`<div class="card-h" style="background:linear-gradient(135deg,#0e8a52,#0a5c39)">🧾 Payment received</div><div class="card-b recpt">
      <div class="stamp">✅ ${sym}${fmt(p.amount)}${suf} from ${p.from||'someone'}</div>
      <div class="rr" style="margin-top:6px"><span>From</span><span>${p.from||'An Axo user'}</span></div>
      <div class="rr"><span>Amount</span><span class="big" style="color:var(--axo)">${sym}${fmt(p.amount)}${suf}</span></div>
      <div class="rr"><span>New ${asset} balance</span><span>${sym}${fmt(S.bal[asset])}${suf}</span></div>
      <div class="rr"><span>Time</span><span>${now()}</span></div></div>`;
    raw(c);
  }
}
async function onIncomingRequestFromPeer(p){
  if(!S || !S.verified) return;
  if(typeof inBub==='function'){
    const sym=p.asset==='USD'?'$':'', suf=p.asset!=='USD'?' '+p.asset:'';
    await typing(500);
    inBub(`🔔 <b>${p.from||'Someone'} is requesting ${sym}${fmt(p.amount)}${suf}</b>${p.note?` — “${p.note}”`:''}`);
    actions([
      {g:'✅',label:`Pay ${sym}${fmt(p.amount)}${suf}`, fn:async()=>{
        if((S.bal[p.asset]||0)<p.amount){await typing(400);inBub(`Not enough ${p.asset} to pay this right now.`);return mainMenu();}
        S.bal[p.asset]=+(S.bal[p.asset]-p.amount).toFixed(2);
        axoEmit('incoming-payment',{amount:p.amount,asset:p.asset,from:S.name||'An Axo user'});
        outBub(`✅ Paid ${sym}${fmt(p.amount)}${suf}`);
        await typing(500);inBub(`Paid ${p.from||''} ${sym}${fmt(p.amount)}${suf}. 💚`);mainMenu();
      }},
      {g:'✕',label:'Decline', dim:true, fn:async()=>{outBub('Decline');await typing(300);inBub('Request declined.');mainMenu();}},
    ],{center:true});
  }
}
const now=()=>{const d=new Date();let h=d.getHours(),m=d.getMinutes();const ap=h>=12?'PM':'AM';h=h%12||12;return `${h}:${m<10?'0':''}${m} ${ap}`};
const scroll=()=>chat.scrollTop=chat.scrollHeight;
const wait=ms=>new Promise(r=>setTimeout(r,ms));

/* ============ ASSETS & RATES ============ */
const ASSET={
  USD :{name:'US Dollar', sub:'Cash balance', cls:'b-usd', badge:'$', kind:'dollar'},
  USDC:{name:'USD Coin',  sub:'Stablecoin',  cls:'b-usdc',badge:'C', kind:'dollar'},
  USDT:{name:'Tether',    sub:'Stablecoin',  cls:'b-usdt',badge:'T', kind:'dollar'},
  KES :{name:'Kenyan Shilling', sub:'Fiat', cls:'b-kes', badge:'Sh',kind:'fiat'},
  SOS :{name:'Somali Shilling',  sub:'Fiat', cls:'b-sos', badge:'S', kind:'fiat'},
};
const USD_TO={KES:129.4, SOS:571.0, USD:1, USDC:1, USDT:1};
const DOLLAR_SPREAD=0.001, FX_MARGIN=0.015, FX_FEE_PCT=0.005, SEND_FEE=0.005;

/* ============ STATE (one ledger) ============ */
let S={};
function reset(){ S={axoId:null,name:null,email:null,phone:null,codeHash:null,_salt:null,sessions:[],verified:false,tier:null,country:null,bank:null,wallet:null,bal:{USD:0,USDC:0,USDT:0,KES:0,SOS:0},step:'boot',draft:{},claims:[],funds:[],pendingIn:[],bankIntents:[],recovery:null,riskLock:false,_iv:null}; chat.innerHTML=''; window._journal=[]; }

/* ============================================================
   AXO IDENTITY SYSTEM
   Permanent identity = Axo ID (NOT the WhatsApp number).
   WhatsApp is only a communication/payment channel.
   Balances, history, KYC, contacts, claims all bind to the Axo ID.

   PROTOTYPE HONESTY: a browser cannot hold real secrets. The Axo Code
   hashing, email verification, session tokens and risk checks below are
   CLIENT-SIDE SIMULATIONS structured to map 1:1 to the real server
   implementation. In production these move server-side (real hash/KDF,
   token store, email provider, KYT/fraud). Boundaries are marked.
   ============================================================ */

/* demo-only hash — stands in for a server-side KDF (argon2/bcrypt).
   NOT real security; just proves "store a hash, never the code". */
async function axoHash(code, salt){
  const enc=new TextEncoder().encode((salt||'')+':'+code);
  const buf=await crypto.subtle.digest('SHA-256', enc);
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
function genAxoId(){ return 'AXO-'+Math.floor(100000+Math.random()*900000); }
function genSalt(){ return [...crypto.getRandomValues(new Uint8Array(8))].map(b=>b.toString(16).padStart(2,'0')).join(''); }
function newSession(channel){ return {id:'sess_'+Math.random().toString(36).slice(2,10), channel, phone:S.phone, startedAt:Date.now(), active:true}; }

async function createIdentity(code){
  S.axoId = S.axoId || genAxoId();
  S._salt = genSalt();
  S.codeHash = await axoHash(code, S._salt);   // store ONLY the hash
  S.sessions = [ newSession('whatsapp') ];
}
async function verifyCode(code){
  if(!S.codeHash) return false;
  const h = await axoHash(code, S._salt);
  return h === S.codeHash;
}

/* rate-limiting / lockout for recovery + code entry */
window.AXO_ATTEMPTS = window.AXO_ATTEMPTS || {count:0, lockedUntil:0};
function attemptsLeft(){ return Math.max(0, 5 - window.AXO_ATTEMPTS.count); }
function isLockedOut(){ return Date.now() < window.AXO_ATTEMPTS.lockedUntil; }
function lockoutRemaining(){ return Math.ceil((window.AXO_ATTEMPTS.lockedUntil - Date.now())/1000); }
function registerFail(){ window.AXO_ATTEMPTS.count++; if(window.AXO_ATTEMPTS.count>=5){ window.AXO_ATTEMPTS.lockedUntil = Date.now()+30000; } }
function resetAttempts(){ window.AXO_ATTEMPTS={count:0, lockedUntil:0}; }

/* session revocation */
function revokeAllSessions(){ (S.sessions||[]).forEach(s=>s.active=false); }
function activeSessions(){ return (S.sessions||[]).filter(s=>s.active); }

/* ===== WhatsApp SEND SIMULATOR (demo only — sends NO real messages) =====
   Mirrors the exact WhatsApp Cloud API request shape so this is a clean
   spec for the real integration later. Nothing leaves the browser. */
window.WA_OUTBOX=[];
function waPhone(){ return S.phone || '+2547 00 000 000'; }
function buildWaPayload(to, text){
  // identical structure to POST https://graph.facebook.com/v20.0/{PHONE_NUMBER_ID}/messages
  return {
    messaging_product:'whatsapp',
    to: (to||waPhone()).replace(/[^\d]/g,''),
    type:'text',
    text:{ preview_url:false, body:text }
  };
}
function waLog(payload){
  const entry={ id:'wamid.DEMO'+Math.random().toString(36).slice(2,12).toUpperCase(), ts:Date.now(), payload, status:'demo-not-sent' };
  window.WA_OUTBOX.push(entry);
  console.log('%c[WhatsApp SIMULATOR — no real message sent]','color:#25d366;font-weight:bold', entry);
  return entry;
}
/* the little "sending → delivered" toast, like a real send confirmation */
async function waSend(text, opts={}){
  const to = opts.to || waPhone();
  const entry = waLog(buildWaPayload(to, text));
  const t=document.getElementById('waToast');
  document.getElementById('waToastT').textContent = opts.title || 'Sending on WhatsApp…';
  document.getElementById('waToastS').textContent = to;
  document.getElementById('waToastTick').textContent='';
  t.classList.add('on');
  await new Promise(r=>setTimeout(r,700));
  document.getElementById('waToastT').textContent = opts.title || 'Sent on WhatsApp';
  document.getElementById('waToastTick').textContent='✓✓';
  await new Promise(r=>setTimeout(r,1600));
  t.classList.remove('on');
  // optionally drop an incoming notification banner (as if it landed on the phone)
  if(opts.notify) waNotif(opts.notifyTitle||'Axo', text);
  return entry;
}
/* incoming WhatsApp-style notification banner (demo) */
let waNotifT;
function waNotif(title, body){
  const n=document.getElementById('waNotif');
  document.getElementById('waNotifTitle').textContent=title;
  document.getElementById('waNotifBody').textContent=body;
  const d=new Date();let h=d.getHours(),m=d.getMinutes();const ap=h>=12?'PM':'AM';h=h%12||12;
  document.getElementById('waNotifTime').textContent=`${h}:${m<10?'0':''}${m} ${ap}`;
  n.classList.add('on');
  clearTimeout(waNotifT); waNotifT=setTimeout(()=>n.classList.remove('on'),4200);
}
function hideWaNotif(){ document.getElementById('waNotif').classList.remove('on'); }
function fmt(n,d=2){return Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});}
function money(k,n){const a=ASSET[k];if(k==='USD')return '$'+fmt(n);if(a.kind==='fiat')return fmt(n,0)+' '+k;return fmt(n)+' '+k;}
function total(){return S.bal.USD+S.bal.USDC+S.bal.USDT;}

/* ============ RENDER HELPERS ============ */
function inBub(h,t=true){const r=document.createElement('div');r.className='row in';r.innerHTML=`<div class="bub">${h}${t?`<span class="sp"></span><span class="t">${now()}</span>`:''}</div>`;chat.appendChild(r);scroll();return r;}
function outBub(h){const r=document.createElement('div');r.className='row out';r.innerHTML=`<div class="bub o">${h}<span class="sp"></span><span class="t">${now()} <span class="tick">✓✓</span></span></div>`;chat.appendChild(r);scroll();return r;}
function sys(t){const d=document.createElement('div');d.className='sys';d.textContent=t;chat.appendChild(d);scroll();}
function raw(n){chat.appendChild(n);scroll();return n;}
async function typing(ms=800){document.getElementById('presence').textContent='typing…';const r=document.createElement('div');r.className='row in';r.innerHTML=`<div class="bub" style="padding:0"><div class="typing"><i></i><i></i><i></i></div></div>`;chat.appendChild(r);scroll();await wait(ms);r.remove();document.getElementById('presence').textContent='online';}
function actions(list,{center=false}={}){const w=document.createElement('div');w.className='acts'+(center?' center':'');list.forEach(a=>{const b=document.createElement('button');b.className='act'+(a.dim?' dim':'');b.innerHTML=`${a.g?`<span class="g">${a.g}</span>`:''}${a.label}`;b.onclick=()=>{w.remove();a.fn();};w.appendChild(b);});return raw(w);}
async function inBub2(h){await typing(450);inBub(h);}

/* ============ BOOT / ONBOARDING ============ */
async function boot(){
  reset();
  sys('Today'); sys('🔒 Messages are end-to-end encrypted.');
  await wait(350); await typing(700);
  inBub(`Welcome to <b>Axo</b> 👋<br>Money is a conversation.<br><br>Axo isn't a place your money hides. Your cash stays in <b>your own bank</b>, and you get your own <b>crypto wallet</b> for digital dollars. Axo is just the chat that moves both — no SIM, no telco, no app.`);
  await wait(400); await typing(600);
  inBub(`Let's set up your account. It takes about 2 minutes.`);
  actions([
    {g:'🚀',label:'Create my Axo account', fn:askName},
    {g:'❓',label:'What is Axo?', dim:true, fn:whatIs},
  ]);
  S.step='onboard';
}
async function whatIs(){
  outBub('What is Axo?');
  await typing(700);
  inBub(`Axo is a chat that manages your money for you. Your cash stays safe in <b>your own bank</b> (Salaam, Premier, Equity…), and Axo gives you your own <b>multi-network crypto wallet</b> for digital dollars (USDC/USDT). You send, pay, save and cash out just by chatting — Axo moves the money, but never holds it for itself.`);
  actions([{g:'🚀',label:'Create my Axo account', fn:askName}]);
}
async function askName(){
  outBub('Create my Axo account');
  await typing(600);
  inBub(`Great. What's your full name, as it appears on your ID?`);
  S.step='name'; txt.focus();
}

/* KYC */
async function startKyc(){
  await typing(700);
  const c=document.createElement('div');c.className='card wide';
  c.innerHTML=`<div class="card-h">🪪 Verify your identity (KYC)</div>
    <div class="card-b"><div style="font-size:13px;color:var(--txt-dim);margin-bottom:6px">The law requires us to verify you before you can hold or move money. Your data is encrypted.</div>
    <div class="kyc-steps"><div class="kyc-dot" id="k1"></div><div class="kyc-dot" id="k2"></div><div class="kyc-dot" id="k3"></div></div></div>`;
  raw(c);
  actions([{g:'📷',label:'Scan my ID document', fn:kycId}],{center:true});

}
async function kycId(){outBub('📷 Scanning ID…');document.getElementById('k1').classList.add('done');await typing(1100);inBub(`ID received ✓ Now take a quick selfie so we know it's you.`);actions([{g:'🤳',label:'Take selfie', fn:kycSelfie}],{center:true});}
async function kycSelfie(){
  outBub('🤳 Selfie captured…');document.getElementById('k2').classList.add('done');
  await typing(1300);document.getElementById('k3').classList.add('done');
  inBub(`✅ <b>You're verified, ${S.name.split(' ')[0]}!</b>`);

  await wait(400);

}

/* STEP: connect your bank — your fiat stays in YOUR bank, Axo never holds it */
const BANKS=[
  {n:'Salaam Bank', sub:'Somalia', c:'#0e8a52', i:'🏦'},
  {n:'Premier Bank', sub:'Somalia', c:'#1c3a5e', i:'🏛️'},
  {n:'Equity Bank', sub:'Kenya', c:'#b5651d', i:'🏦'},
  {n:'KCB', sub:'Kenya', c:'#2775ca', i:'🏛️'},
];
async function linkBank(){
  await typing(700);
  inBub(`Now let's set up where your money lives. Here's how Axo works, so it's clear:<br><br>💡 <b>If you have a bank, your money stays in your own bank.</b> Axo never holds it — we just move it when you ask.`);
  await typing(600);
  inBub(`Do you have a bank account to connect?`);
  const c=document.createElement('div');c.className='card wide';
  c.innerHTML=`<div class="card-b" style="padding-top:10px">${BANKS.map((b,i)=>`<div class="bank-link" data-i="${i}"><div class="bl-ico" style="background:${b.c}">${b.i}</div><div class="bl-n">${b.n}<small>${b.sub}</small></div><div class="cp-arrow" style="color:var(--txt-dim)">›</div></div>`).join('')}
    <div class="bank-link" data-none="1" style="margin-top:8px;border:1px dashed rgba(37,181,115,.4)"><div class="bl-ico" style="background:var(--axo-deep)">✨</div><div class="bl-n">I don't have a bank account<small>Axo will open a safe account for you</small></div><div class="cp-arrow" style="color:var(--axo)">›</div></div>
  </div>`;
  const node=raw(c);
  node.querySelectorAll('.bank-link').forEach(el=>el.onclick=()=>{
    if(el.dataset.none){node.remove();openAxoAccount();return;}
    const b=BANKS[+el.dataset.i];node.remove();doLinkBank(b);
  });
  S.step='link-bank';
}
async function doLinkBank(b){
  S.bank=b; S.tier=1; S.country=b.sub;
  outBub(`Connect ${b.n}`);
  await typing(1000);
  inBub(`🔐 Redirecting to ${b.n} to authorise the connection securely… (you approve in your bank's own app — Axo never sees your bank password.)`);
  await wait(900);await typing(800);
  S.bal.USD=1250;S.bal.KES=0;S.bal.SOS=0;
  inBub(`✅ <b>${b.n} connected.</b> Axo can now see your balance and move money on your instruction — the money stays in ${b.n}.`);
  await wait(400);
  await createWallet();
}

/* TIER 2 — unbanked: Axo opens a safeguarded account on its regulated rails.
   Funds are held ring-fenced at Axo's licensed partner bank, in the user's
   name — NOT mixed with Axo's own money. This is stored-value / e-money. */
async function openAxoAccount(){
  S.tier=2;
  outBub("I don't have a bank account");
  await typing(700);
  inBub(`No problem — that's exactly who Axo is for. 💚 First, which country are you in? This lets us show the right ways to add and withdraw money.`);
  actions([
    {g:'🇸🇴',label:'Somalia', fn:()=>{S.country='Somalia';outBub('🇸🇴 Somalia');openAxoAccount2();}},
    {g:'🇰🇪',label:'Kenya', fn:()=>{S.country='Kenya';outBub('🇰🇪 Kenya');openAxoAccount2();}},
    {g:'🌍',label:'Somewhere else', fn:()=>{S.country='Other';outBub('🌍 Other');openAxoAccount2();}},
  ],{center:true});
  S.step='pick-country';
}
async function openAxoAccount2(){
  await typing(800);
  inBub(`We'll open a <b>safe Axo account</b> for you, no bank needed.`);
  await typing(700);
  inBub(`Here's the honest part, so you always know where your money is:<br><br>🛡️ Your money is held <b>safely and separately</b> at Axo's licensed partner bank, <b>in your name</b> — kept apart from Axo's own money, and protected by regulation. You can open a real bank later and link it anytime.`);
  await typing(900);
  S.bank={n:'Axo Account',c:'#0e8a52',i:'✨',safeguarded:true};
  S.bal.USD=0;S.bal.KES=0;S.bal.SOS=0;
  inBub(`✅ <b>Your Axo account is open.</b> Add money anytime — cash at an agent, or a transfer from family abroad — and it lands here, safe.`);
  await wait(400);
  await createWallet();
}

/* STEP: create the user's OWN multi-network wallet for stablecoins */
async function createWallet(){
  await typing(800);
  inBub(`One more thing — Axo is creating <b>your own crypto wallet</b>, so you can hold digital dollars (USDC/USDT) too. It works across multiple networks, and it's <b>yours</b> — we secure it with your identity, so there's no scary secret phrase to lose.`);
  await typing(1100);
  S.wallet={addr:'0x'+Array.from({length:40},()=>'0123456789abcdef'[Math.floor(Math.random()*16)]).join('')};
  S.bal.USDC=350;S.bal.USDT=100;
  inBub(`✅ <b>Your Axo Wallet is ready.</b>`);
  await wait(300);
  await showBalance();
  await wait(400);await mainMenu(true);
}

/* ============ BALANCE — TWO POOLS, both the user's ============ */
function shortAddr(a){return a.slice(0,6)+'…'+a.slice(-4);}
async function showBalance(){
  await typing(600);
  const bank=S.bank||{n:'Your Bank',c:'#1c3a5e',i:'🏦'};

/* Device contacts: filled from the NATIVE picker (Contact Picker API) where
   supported. We do NOT ship an Axo contact directory. A couple of seed
   entries exist ONLY so Recent/quick-repeat and the simulator work in demos
   and on platforms (iPhone Safari, desktop) where the OS blocks web contact
   access. On Android Chrome the user's real contacts are used. */
const CONTACTS=[
  {n:'Hassan Ali', p:'+252 61 123 4567', c:'#7c4dff', on:true},
  {n:'Amina Yusuf', p:'+252 61 987 6543', c:'#e05b4b', on:true},
  {n:'Mother 💚', p:'+252 61 222 1188', c:'#2e7d5b', on:true},
  {n:'Omar (Nairobi)', p:'+254 712 445 900', c:'#2775ca', on:false},
];
const AVA_COLORS=['#7c4dff','#e05b4b','#2e7d5b','#2775ca','#c98a1a','#0e8a52','#4a76c4','#b5651d','#8e44ad','#16a085'];
function avaColor(name){ let h=0; for(const ch of (name||'?')) h=(h*31+ch.charCodeAt(0))>>>0; return AVA_COLORS[h%AVA_COLORS.length]; }

var S_RECENTS=[];
function pushRecent(k){
  S_RECENTS=S_RECENTS.filter(r=>r.p!==k.p);
  S_RECENTS.unshift(k);
  if(S_RECENTS.length>8)S_RECENTS.pop();
}
function looksLikePhone(s){return /^[+\d][\d\s()-]{6,}$/.test((s||'').trim());}
const nativeContactsSupported = ('contacts' in navigator && 'ContactsManager' in window);

/* open the actual OS contact picker (Android Chrome etc.) */
async function openNativeContacts(onPick){
  try{
    const props=['name','tel'];
    const selected=await navigator.contacts.select(props, {multiple:false});
    if(!selected || !selected.length) return false;
    const raw=selected[0];
    const name=(raw.name&&raw.name[0])||'Contact';
    const tel=(raw.tel&&raw.tel[0])||'';
    if(!tel){ return false; }
    onPick({ n:name, p:tel, c:avaColor(name), on:false, fromDevice:true });
    return true;
  }catch(e){
    return false; // user cancelled or blocked → caller keeps the fallback open
  }
}

function recipientPicker(prompt, onPick){
  inBub(prompt);
  const c=document.createElement('div');c.className='card wide';
  c.innerHTML=`<div class="card-b" style="padding-top:10px">
    <div class="rp-search"><span style="color:var(--txt-dim)">🔍</span><input id="rpq" placeholder="Search name or enter a number" autocomplete="off" inputmode="text"></div>
    <div id="rpBody"></div>
  </div>`;
  const node=raw(c);
  const q=node.querySelector('#rpq');
  const body=node.querySelector('#rpBody');

  function choose(k){ node.remove(); pushRecent(k); onPick(k); }

  function draw(filter=''){
    const f=filter.trim().toLowerCase();
    let html='';

    // 1) Primary CTA: pick from the phone's own contacts (native where supported)
    if(!f){
      html+=`<div class="rp-phone-btn" id="rpDevice"><div class="pp-ic">👥</div><div class="cp-name">Choose from phone contacts<span>${nativeContactsSupported?'Open your contacts':'Search or enter a number below'}</span></div><div class="cp-arrow" style="margin-left:auto;color:var(--txt-dim)">›</div></div>`;
    }

    // 2) If input looks like a phone number not matching a contact → send to that number
    if(looksLikePhone(filter)){
      const known=CONTACTS.find(c=>c.p.replace(/\D/g,'').includes(filter.replace(/\D/g,'')));
      if(!known){
        html+=`<div class="rp-sec">Send to this number</div>
          <div class="rp-phone-btn" id="rpNum"><div class="pp-ic">📞</div><div class="cp-name">${filter.trim()}<span>New recipient</span></div><div class="cp-arrow" style="margin-left:auto;color:var(--txt-dim)">›</div></div>`;
      }
    }

    // 3) Recent (quick repeat) — only when not filtering
    if(!f && S_RECENTS.length){
      html+=`<div class="rp-sec">Recent</div><div class="rp-recents">${S_RECENTS.map((k,i)=>`
        <div class="rp-recent" data-recent="${i}"><div class="rr-av" style="background:${k.c||avaColor(k.n)}">${(k.n||'?')[0]}</div><div class="rr-n">${(k.n||'').split(' ')[0]}</div></div>`).join('')}</div>`;
    }

    // 4) Saved contacts (device contacts once imported; seed set otherwise)
    const fd=f.replace(/\D/g,'');
    const matches=CONTACTS.filter(k=> !f || k.n.toLowerCase().includes(f) || (fd.length>0 && k.p.replace(/\D/g,'').includes(fd)));
    if(matches.length){
      html+=`<div class="rp-sec">${f?'Results':'Contacts'}</div>`;
      html+=matches.map(k=>{const i=CONTACTS.indexOf(k);return `<div class="contact-pick" data-i="${i}"><div class="cp-ava" style="background:${k.c||avaColor(k.n)}">${(k.n||'?')[0]}</div><div class="cp-name">${k.n}<span>${k.p}</span></div><div class="cp-arrow">›</div></div>`;}).join('');
    } else if(f && !looksLikePhone(filter)) {
      html+=`<div class="rp-empty">No match. Type a phone number to send to anyone.</div>`;
    }

    body.innerHTML=html;

    // native contact picker
    const dev=body.querySelector('#rpDevice');
    if(dev)dev.onclick=async()=>{
      if(nativeContactsSupported){
        const done=await openNativeContacts(k=>{ node.remove(); pushRecent(k); onPick(k); });
        if(done) return;
        // if cancelled/blocked, just leave the picker as-is
      }else{
        // unsupported (iPhone Safari / desktop): guide to search/number
        q.focus();
      }
    };
    body.querySelectorAll('.rp-recent').forEach(el=>el.onclick=()=>choose(S_RECENTS[+el.dataset.recent]));
    body.querySelectorAll('.contact-pick').forEach(el=>el.onclick=()=>choose(CONTACTS[+el.dataset.i]));
    const numBtn=body.querySelector('#rpNum');
    if(numBtn)numBtn.onclick=()=>{
      const rawv=filter.trim();
      const digits=rawv.replace(/\D/g,'');
      const onAxo = parseInt(digits.slice(-1))%2===0; // demo heuristic
      choose({n:rawv, p:rawv, c:avaColor(rawv), on:onAxo, isNumber:true});
    };
  }
  q.addEventListener('input',()=>draw(q.value));
  draw('');
  return node;
}

/* ============ CLAIM MONEY (Axo Individual only) ============
   Sending to a non-Axo recipient creates a secure Claim link.
   Money is already debited from the sender (reserved against the claim).
   States: pending → claimed | expired | cancelled | failed.
   Recipient opens the link WITHOUT an Axo account, verifies, and settles.
   Double-claim prevented by state guard. */
if(!window.CLAIMS) window.CLAIMS={};
function newToken(){return Array.from({length:24},()=>'abcdefghijkmnpqrstuvwxyz23456789'[Math.floor(Math.random()*32)]).join('');}
async function createClaim(d){
  const token=newToken();
  const claim={
    token, sender:S.name||'An Axo user', to:d.to.n, phone:d.to.p,
    amount:d.amount, asset:d.asset, fee:d.fee,
    state:'pending', createdAt:Date.now(), expiresAt:Date.now()+7*24*3600*1000
  };
  window.CLAIMS[token]=claim;
  if(!S.claims)S.claims=[];
  S.claims.push(token);
  await typing(700);
  inBub(`${d.to.n.split(' ')[0]} isn't on Axo yet — so I've created a secure <b>Claim Money</b> link. Share it on WhatsApp and they can claim it, even without an Axo account.`);
  await wait(200);
  renderClaimCard(token);
}
function claimStateBadge(st){
  const map={pending:['cs-pending','⏳ Pending'],claimed:['cs-claimed','✅ Claimed'],expired:['cs-expired','⌛ Expired'],cancelled:['cs-cancelled','🚫 Cancelled'],failed:['cs-failed','⚠️ Failed']};
  const [c,l]=map[st]||map.pending; return `<span class="claim-state ${c}">${l}</span>`;
}
function renderClaimCard(token){
  const cl=window.CLAIMS[token];
  const url=`axo.money/claim/${token.slice(0,8)}`;
  const sym=cl.asset==='USD'?'$':'', suf=cl.asset!=='USD'?' '+cl.asset:'';
  const c=document.createElement('div');c.className='card wide';c.dataset.claim=token;
  c.innerHTML=`<div class="card-h">🎁 Claim Money link</div><div class="card-b">
    <div class="recpt">
      <div class="rr"><span>For</span><span>${cl.to}</span></div>
      <div class="rr"><span>Amount</span><span class="big" style="color:var(--axo)">${sym}${fmt(cl.amount)}${suf}</span></div>
      <div class="rr"><span>Status</span><span>${claimStateBadge(cl.state)}</span></div>
      <div class="rr"><span>Expires</span><span>in 7 days</span></div>
    </div>
    <div class="claimlink">🔗 ${url}<span class="cp" onclick="copyClaim('${token}',this)">copy</span></div>
    <button class="share-btn" onclick="shareClaim('${token}',this)">🟢 Share via WhatsApp</button>
    <button class="act" style="border-radius:9px;margin-top:6px;width:100%;background:var(--wa-field)" onclick="openClaim('${token}')">👁️ Open claim link (as recipient)</button>
    <div id="claimctl-${token}"></div>
  </div>`;
  raw(c);
  renderClaimControls(token);
}
function renderClaimControls(token){
  const cl=window.CLAIMS[token];const box=document.getElementById('claimctl-'+token);if(!box)return;
  if(cl.state==='pending'){
    box.innerHTML=`<button class="act dim" style="border-radius:9px;margin-top:6px;width:100%;background:var(--wa-field)" onclick="cancelClaim('${token}')">✕ Cancel & refund me</button>`;
  }else{ box.innerHTML=''; }
}
function copyClaim(token,el){el.textContent='copied ✓';}
function shareClaim(token,el){
  el.innerHTML='✓ Shared on WhatsApp';el.style.background='#0e8a52';
  const cl=window.CLAIMS[token];
  const sym=cl.asset==='USD'?'$':'', suf=cl.asset!=='USD'?' '+cl.asset:'';
  waSend(`💸 ${cl.sender} sent you ${sym}${fmt(cl.amount)}${suf} on Axo!\n\nClaim it here — no account needed to start:\naxo.money/claim/${token.slice(0,8)}\n\nThis link is secure and expires in 7 days.`, {title:'Claim link sent', to:cl.phone||waPhone(), notify:true, notifyTitle:'Axo'});
}
function refreshClaimCard(token){
  const card=document.querySelector(`[data-claim="${token}"]`);if(!card)return;
  const cl=window.CLAIMS[token];
  const badge=card.querySelector('.claim-state');if(badge)badge.outerHTML=claimStateBadge(cl.state);
  renderClaimControls(token);
}
async function cancelClaim(token){
  const cl=window.CLAIMS[token];
  if(cl.state!=='pending')return; // guard
  cl.state='cancelled';
  // refund the reserved money back to sender
  const total=+(cl.amount+cl.fee).toFixed(2);
  S.bal[cl.asset]=+((S.bal[cl.asset]||0)+total).toFixed(2);
  refreshClaimCard(token);
  outBub('✕ Cancel claim');
  await typing(500);
  inBub(`Claim cancelled. ${cl.asset==='USD'?'$':''}${fmt(total)}${cl.asset!=='USD'?' '+cl.asset:''} refunded to your balance. 💚`);
  await mainMenu();
}

/* ---- RECIPIENT SIDE: opening the claim link without an Axo account ---- */
let ACTIVE_CLAIM=null;
function openClaim(token){
  ACTIVE_CLAIM=token;
  const cl=window.CLAIMS[token];
  document.getElementById('claimview').classList.add('on');
  // expiry check on open
  if(cl.state==='pending' && Date.now()>cl.expiresAt){ cl.state='expired'; }
  renderClaimView();
}
function closeClaim(){
  document.getElementById('claimview').classList.remove('on');
  const token=ACTIVE_CLAIM;
  ACTIVE_CLAIM=null;
  if(token){
    refreshClaimCard(token);
    const cl=window.CLAIMS[token];
    // if the sender is this user and the claim just completed, notify them in-thread
    if(cl && cl.state==='claimed' && S.claims && S.claims.includes(token) && !cl._notified){
      cl._notified=true;
      const sym=cl.asset==='USD'?'$':'', suf=cl.asset!=='USD'?' '+cl.asset:'';
      (async()=>{await typing(600);inBub(`🎉 ${cl.to.split(' ')[0]} claimed the ${sym}${fmt(cl.amount)}${suf} you sent — they're now on Axo too! 💚`);})();
    }
  }
}
function renderClaimView(){
  const cl=window.CLAIMS[ACTIVE_CLAIM];
  const body=document.getElementById('claimBody');
  const sym=cl.asset==='USD'?'$':'', suf=cl.asset!=='USD'?' '+cl.asset:'';
  // terminal states
  if(cl.state==='claimed'){
    body.innerHTML=`<div class="cv-done">✅</div><div class="cv-big-state" style="color:var(--axo)">Already claimed</div><div class="cv-note">This money has already been claimed and settled. A claim link can only be used once.</div><button class="cv-claim-btn" style="margin-top:20px;background:var(--wa-field)" onclick="closeClaim()">Close</button>`;
    return;
  }
  if(cl.state==='cancelled'){
    body.innerHTML=`<div class="cv-done">🚫</div><div class="cv-big-state" style="color:var(--danger)">Claim cancelled</div><div class="cv-note">The sender cancelled this claim and the money was returned to them.</div><button class="cv-claim-btn" style="margin-top:20px;background:var(--wa-field)" onclick="closeClaim()">Close</button>`;
    return;
  }
  if(cl.state==='expired'){
    body.innerHTML=`<div class="cv-done">⌛</div><div class="cv-big-state" style="color:var(--danger)">Claim expired</div><div class="cv-note">This claim link has expired. Ask ${cl.sender.split(' ')[0]} to send it again.</div><button class="cv-claim-btn" style="margin-top:20px;background:var(--wa-field)" onclick="closeClaim()">Close</button>`;
    return;
  }
  if(cl.state==='failed'){
    body.innerHTML=`<div class="cv-done">⚠️</div><div class="cv-big-state" style="color:var(--danger)">Claim failed</div><div class="cv-note">Something went wrong settling this claim. The money is safe with the sender.</div><button class="cv-claim-btn" style="margin-top:20px;background:var(--wa-field)" onclick="closeClaim()">Close</button>`;
    return;
  }
  // pending — the claim offer
  body.innerHTML=`
    <div class="cv-gift">🎁</div>
    <div class="cv-from"><b>${cl.sender}</b> sent you money</div>
    <div class="cv-amt"><small>${sym}</small>${fmt(cl.amount)}<small>${suf}</small></div>
    <div class="cv-card">
      <div class="cv-row"><span>From</span><b>${cl.sender}</b></div>
      <div class="cv-row"><span>Amount</span><b>${sym}${fmt(cl.amount)}${suf}</b></div>
      <div class="cv-row"><span>Currency</span><b>${cl.asset}</b></div>
      <div class="cv-row"><span>Status</span><b style="color:var(--pending)">Ready to claim</b></div>
    </div>
    <button class="cv-claim-btn" onclick="claimStep1()">Claim Money</button>
    <div class="cv-note">🛡️ You don't need an Axo account yet — we'll set one up in a moment so your money has a safe home. This link works only once.</div>`;
}
function claimStep1(){
  const cl=window.CLAIMS[ACTIVE_CLAIM];
  if(cl.state!=='pending'){renderClaimView();return;} // guard: no double-claim
  const body=document.getElementById('claimBody');
  body.innerHTML=`
    <div class="cv-gift">📱</div>
    <div class="cv-big-state">Claim your money</div>
    <div class="cv-note" style="margin-bottom:8px">Quick setup so your ${cl.asset} has a safe home. Takes a minute.</div>
    <div class="cv-field"><label>YOUR NAME</label><input id="clName" placeholder="Full name"></div>
    <div class="cv-field"><label>YOUR PHONE (WHATSAPP)</label><input id="clPhone" placeholder="${cl.phone||'+252 …'}" inputmode="tel"></div>
    <button class="cv-claim-btn" onclick="claimStep2()">Continue</button>
    <div class="cv-note">By continuing you'll create your own Axo account and verify your identity — the same protection every Axo user has.</div>`;
}
function claimStep2(){
  const cl=window.CLAIMS[ACTIVE_CLAIM];
  const name=(document.getElementById('clName')?.value||'').trim();
  if(!name){ document.getElementById('clName').style.borderColor='var(--danger)'; return; }
  cl._recipientName=name;
  const body=document.getElementById('claimBody');
  body.innerHTML=`
    <div class="cv-gift">🪪</div>
    <div class="cv-big-state">Verify it's you</div>
    <div class="cv-note" style="margin-bottom:14px">A quick ID check keeps your money safe — required to receive on Axo.</div>
    <button class="cv-claim-btn" onclick="claimSettle()">📷 Scan ID & selfie</button>
    <div class="cv-note">Your data is encrypted. This is the standard Axo KYC.</div>`;
}
async function claimSettle(){
  const cl=window.CLAIMS[ACTIVE_CLAIM];
  const body=document.getElementById('claimBody');
  // guard against double-claim at the settlement moment
  if(cl.state!=='pending'){renderClaimView();return;}
  body.innerHTML=`<div class="cv-spin"></div><div class="cv-big-state">Settling your claim…</div><div class="cv-note">Verifying and releasing the money.</div>`;
  // lock immediately to prevent a second concurrent claim
  cl.state='settling';
  await new Promise(r=>setTimeout(r,1700));
  cl.state='claimed'; cl.claimedAt=Date.now();
  const sym=cl.asset==='USD'?'$':'', suf=cl.asset!=='USD'?' '+cl.asset:'';
  body.innerHTML=`
    <div class="cv-done">🎉</div>
    <div class="cv-big-state" style="color:var(--axo)">Money claimed!</div>
    <div class="cv-amt" style="font-size:34px"><small>${sym}</small>${fmt(cl.amount)}<small>${suf}</small></div>
    <div class="cv-note" style="margin:10px 0">is now in your new Axo account, ${cl._recipientName.split(' ')[0]}. Welcome to Axo 💚</div>
    <div class="cv-card"><div class="cv-row"><span>From</span><b>${cl.sender}</b></div><div class="cv-row"><span>Claimed</span><b>${sym}${fmt(cl.amount)}${suf}</b></div><div class="cv-row"><span>Status</span><b style="color:var(--axo)">Settled</b></div></div>
    <button class="cv-claim-btn" onclick="closeClaim()">Done</button>`;
  // notify the sender back in their thread (if this session is the sender)
  if(ACTIVE_CLAIM && S.claims && S.claims.includes(ACTIVE_CLAIM)){
    setTimeout(()=>{ if(!document.getElementById('claimview').classList.contains('on')){} }, 0);
  }
}

/* ============================================================
   FUNDRAISE / DONATIONS
   Create → Axo review/approval → share to group → contribute → track.
   Reuses the shareable-link pattern and payment flow.
   NOTE FOR PRODUCTION: collecting from the public is highly regulated
   (charity/fundraising registration, AML, consumer protection). The
   Axo approval gate below is the compliance checkpoint — real vetting
   (organizer KYC, cause verification) is a backend/compliance job.
   Funds here are tracked in a ring-fenced fundraiser pool, transparent
   to contributors. Demo simulates the review; real build routes to
   Axo's compliance team (Samira/Mohamud).
   ============================================================ */

async function axoReviewDecision(id){
  const fund=window.FUNDS[id];

  fund.state='approved';
  fund.approvedAt=Date.now();
  inBub(`✅ <b>Approved!</b> Your fundraiser “${fund.title}” is now live. Share it in your group chats and start collecting. 💚`);
  await wait(200);
  renderFundCard(id, {withShare:true});

  await mainMenu();

function fundStateBadge(st){
  const map={pending:['fs-pending','⏳ Under review'],approved:['fs-approved','✅ Approved'],active:['fs-active','🟢 Active'],rejected:['fs-rejected','🚫 Rejected'],completed:['fs-completed','🎉 Target reached'],closed:['fs-closed','🔒 Closed']};
  const [c,l]=map[st]||map.pending; return `<span class="fund-status ${c}">${l}</span>`;
}
function renderFundCard(id, {withShare=false}={}){
  const f=window.FUNDS[id];
  const pct=Math.min(100, Math.round((f.raised/f.target)*100));
  const url=`axo.money/give/${id.slice(4)}`;
  const c=document.createElement('div');c.className='fund-card';c.dataset.fund=id;
  c.innerHTML=`<div class="fund-banner"><div class="fb-cause">🎗️ ${f.title}</div><div class="fb-org">Organized by ${f.organizer} · ${id}</div></div>
    <div class="fund-body">
      <div class="fund-stats"><span class="fund-raised">$${fmt(f.raised)}</span><span class="fund-target">of $${fmt(f.target)}</span></div>
      <div class="fund-prog"><i style="width:${pct}%"></i></div>
      <div class="fund-stats"><span style="color:var(--txt-dim)">${f.contributors} contributor${f.contributors===1?'':'s'}</span><span>${fundStateBadge(f.state)}</span></div>
      ${withShare&&f.state==='approved'?`<div class="claimlink" style="margin-top:9px">🔗 ${url}<span class="cp" onclick="copyFund('${id}',this)">copy</span></div>

function copyFund(id,el){el.textContent='copied ✓';}
function shareFund(id,el){

  waSend(`🎗️ ${f.organizer} started a fundraiser on Axo:\n\n“${f.title}”\nGoal: $${fmt(f.target)}\n\nEvery contribution helps 💚 Give here:\naxo.money/give/${id.slice(4)}`, {title:'Fundraiser shared to group', to:S.phone, notify:true, notifyTitle:'Axo · Group'});

function refreshFundCard(id){
  const card=document.querySelector(`[data-fund="${id}"]`); if(!card) return;
  const f=window.FUNDS[id]; const pct=Math.min(100, Math.round((f.raised/f.target)*100));
  const barI=card.querySelector('.fund-prog i'); if(barI)barI.style.width=pct+'%';
  const raised=card.querySelector('.fund-raised'); if(raised)raised.textContent='$'+fmt(f.raised);
  const badge=card.querySelector('.fund-status'); if(badge)badge.outerHTML=fundStateBadge(f.state);
}
async function myFundraisers(){
  outBub('My fundraisers');await typing(500);

// deterministic-looking QR pattern (decorative)
function qrCells(){
  let s='';for(let i=0;i<121;i++){const r=Math.floor(i/11),c=i%11;
    const corner=(r<3&&c<3)||(r<3&&c>7)||(r>7&&c<3);
    const on = corner ? ((r===0||r===2||c===0||c===2||(r===1&&c===1))||(r<3&&c>7&&(r===0||r===2||c===8||c===10||(r===1&&c===9)))||(r>7&&c<3&&(r===8||r===10||c===0||c===2||(r===9&&c===1)))) : (Math.random()>0.5);
    s+=`<i class="${on?'':'o'}"></i>`;}
  return s;
}

/* ============ WITHDRAW CASH (open peer-agent network) ============
   Model: user broadcasts a cash-out request. Any nearby fulfiller — bank,
   shop, or online agent — can accept. The moment one accepts, the user's
   digital funds are ESCROWED (held, not sent). A one-time code is the
   handshake at handover. Funds release to the agent ONLY when the USER
   confirms cash received. Proof supports the handoff; it does not release. */

  {n:'Bank of Africa — Bakaara', t:'bank',  cash:5000, dist:0.4, open:true,  x:64, y:30, fee:0.00},

/* ============ ADD MONEY (country-aware funding rails) ============
   Which rails appear depends on the user's country. A rail lands money in
   the user's fiat pool (bank or safeguarded Axo account). Crypto top-up
   lands in the wallet. */
const RAILS={
  card:   {i:'💳',cls:'card', n:'Debit / Credit card', sub:'Instant · Visa, Mastercard', all:true},
  mpesa:  {i:'📱',cls:'mpesa',n:'M-Pesa', sub:'Mobile money · instant', countries:['Kenya']},
  evc:    {i:'📲',cls:'mpesa',n:'Mobile money', sub:'EVC Plus, Sahal, eDahab', countries:['Somalia']},
  agent:  {i:'🏪',cls:'agent',n:'Cash at an agent', sub:'Hand cash to a nearby agent', countries:['Kenya','Somalia']},
  bankt:  {i:'🏦',cls:'bankt',n:'Bank transfer', sub:'From your bank account', all:true},
  remit:  {i:'🌍',cls:'remit',n:'From family abroad', sub:'Diaspora remittance', all:true},
  crypto: {i:'🪙',cls:'crypto',n:'Crypto top-up', sub:'Send USDC/USDT to your wallet', all:true},
};
function railsForCountry(country){
  const out=[];
  for(const k in RAILS){const r=RAILS[k];if(r.all||(r.countries&&r.countries.includes(country)))out.push({k,...r});}
  return out;
}
async function addMoneyStart(){
  outBub('➕ Add Money');
  if(!S.verified){await typing(600);inBub(`You'll need to verify your identity first.`);return startKyc();}
  const country=S.country||'Other';
  await typing(600);
  inBub(`How would you like to add money?${country!=='Other'?` These work in <b>${country}</b>:`:''}`);

function cartCount(){ return Object.values(CART||{}).reduce((a,b)=>a+b,0); }
function cartTotal(){
  let t=0; if(!CUR_SHOP) return 0;
  CUR_SHOP.menu.forEach(cat=>cat.items.forEach(it=>{ if(CART[it.n]) t+=it.p*CART[it.n]; }));

function renderShop(){
  const shop=CUR_SHOP;

    if(mode==='dollar'){const out=amount*(1-DOLLAR_SPREAD);return {out,rate:1,feeLabel:`Spread ${(DOLLAR_SPREAD*100).toFixed(2)}%`,feeVal:amount-out};}
    const usd=amount,mid=USD_TO[to],applied=mid*(1-FX_MARGIN),gross=usd*applied,fee=gross*FX_FEE_PCT;
    return {out:gross-fee,rate:applied,mid,feeLabel:`FX fee ${(FX_FEE_PCT*100).toFixed(1)}%`,feeVal:fee};
  }
  function refresh(){
    const a=ASSET[from],b=ASSET[to];
    $('#fromLbl').textContent=a.name;$('#toLbl').textContent=b.name;

    const avail=S.bal[from]||0,e=$('#err'),g=$('#go');

    else if(n<=0){e.textContent='';g.disabled=true;}else{e.textContent='';g.disabled=false;}
    g.textContent=mode==='fx'?'Lock rate & continue':'Continue';
  }
  node.querySelectorAll('.key').forEach(bn=>bn.onclick=()=>{const k=bn.dataset.k;if(k==='⌫')val=val.length>1?val.slice(0,-1):'0';else if(k==='.'){if(!val.includes('.'))val+='.';}else{if(val==='0')val=k;else if(!(val.includes('.')&&val.split('.')[1].length>=2))val+=k;}refresh();});
  $('#swap').onclick=()=>{if(mode==='dollar'){const t=from;from=to;to=t;refresh();}else{inBub2(`To go the other way (KES → USD) you'd cash-in local currency first via an agent or bank deposit — that's a separate flow.`);}};
  $('#go').onclick=()=>{const n=parseFloat(val)||0,q=quote(n);node.remove();confirmConvert({mode,from,to,amount:n,q});};
  refresh();S.step='convert-amt';
}

   The magic: money as conversation. Parse plain text → intent + slots
   (amount, recipient, asset) → route straight into the real flows,

// transaction journal so "what did I spend" is a real read, not a fake
if(!window._journal) window._journal=[];
function logTx(kind,asset,amount,who,dir){ // dir: 'out'|'in'
  window._journal.push({kind,asset,amount:+amount,who,dir,t:Date.now()});
}

function matchContact(text){
  const l=text.toLowerCase();
  // aliases people actually type
  const alias={'mum':'Mother','mom':'Mother','mother':'Mother','hassan':'Hassan','amina':'Amina','omar':'Omar'};
  for(const key in alias){ if(l.includes(key)) return CONTACTS.find(c=>c.n.toLowerCase().includes(alias[key].toLowerCase())); }
  // direct name match
  return CONTACTS.find(c=>l.includes(c.n.split(' ')[0].toLowerCase()))||null;
}
function parseAmount(text){
  // $50, 50 dollars, 50 usdc, "fifty" (common ones)
  const words={one:1,two:2,three:3,four:4,five:5,ten:10,twenty:20,thirty:30,forty:40,fifty:50,hundred:100};
  const m=text.replace(/,/g,'').match(/(\d+(?:\.\d{1,2})?)/);
  if(m) return parseFloat(m[1]);
  for(const w in words){ if(new RegExp('\\b'+w+'\\b','i').test(text)) return words[w]; }
  return null;
}
function parseAsset(text){
  const l=text.toLowerCase();
  if(/usdc/.test(l))return'USDC'; if(/usdt|tether/.test(l))return'USDT';
  if(/kes|shilling|ksh/.test(l))return'KES'; if(/sos|somali/.test(l))return'SOS';
  return'USD';
}

// intent classifier — order matters (specific → general)
function classify(low){
  if(/(spent|spend|spending|where.*money|summary|report|this week|this month|insight|analy)/.test(low)) return 'insights';
  if(/(paltas|book.*stay|book.*apartment|smart living|book.*hotel|reserve.*stay|find.*place to stay)/.test(low)) return 'paltas';
  if(/(order|shop|buy food|restaurant|menu|order food|takeaway|takeout)/.test(low)) return 'shop';
  if(/(fundrais|donat|raise money|raise fund|harambee|collect.*fund|charity|contribut)/.test(low)) return 'fundraise';
  if(/(recover|recovery|locked out|can't get in|cant get in|lost access|get back in)/.test(low)) return 'recover';
  if(/(lost my phone|lost phone|lost my whatsapp|lost whatsapp|stolen|new phone|phone stolen)/.test(low)) return 'lostphone';
  if(/(change.*number|new number|change whatsapp|switch number|update.*number)/.test(low)) return 'changenumber';
  if(/(security|my axo id|account settings|sessions|recovery code|axo code)/.test(low)) return 'security';
  if(/(scan|qr)/.test(low)) return 'scan';
  if(/(paybill|pay bill|electricity|water bill|kplc|dstv|buy goods|till|pay.*shop|pay.*coffee|pay.*java|pay.*naivas|checkout|kilimall)/.test(low)) return 'pay';
  if(/(save|saving|put aside|set aside|lock away)/.test(low)) return 'save';
  if(/(withdraw|cash out|cash-out|get cash|need cash|take out|cash near|withdraw.*cash)/.test(low)) return 'withdraw';
  if(/(deposit|add cash|add money|top up|top-up|topup|pay in|put in cash|fund my|load money|cash in)/.test(low)) return 'deposit';
  if(/(fx|shilling|convert to (kes|sos)|to shilling|local currency|exchange)/.test(low)) return 'fx';
  if(/(swap|convert|to usdc|to usdt|to stable|stablecoin)/.test(low)) return 'swapdollar';
  if(/(request|ask .* for|remind .* to pay|invoice)/.test(low)) return 'request';
  if(/(receive|my qr|qr code|get paid|my (axo )?id|pay me)/.test(low)) return 'receive';
  if(/(send|pay|transfer|give)/.test(low)) return 'send';
  if(/(balance|how much do i have|what.*have|my money)/.test(low)) return 'balance';
  if(/(help|what can|how do)/.test(low)) return 'help';
  return null;
}

function handleText(v){
  const t=v.trim();if(!t)return;const low=t.toLowerCase();
  if(S.step==='name'){if(t.split(' ').length<2){outBub(t);inBub2(`Please enter your first and last name.`);return;}S.name=t;outBub(t);afterName();return;}
  if(S.step==='phone'){
    const digits=t.replace(/[^\d]/g,'');
    if(digits.length<7){outBub(t);inBub2(`Please enter a valid WhatsApp number, including country code (e.g. +254 712 345 678).`);return;}
    S.phone = t.trim().startsWith('+') ? t.trim() : '+'+digits;
    outBub(t);afterPhone();return;
  }
  if(S.step==='email'){
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(t.trim())){outBub(t);inBub2(`That doesn't look like a valid email. Please try again.`);return;}
    S.email=t.trim().toLowerCase();
    outBub(t);
    // demo: simulated email verification (real build sends a verification link)
    (async()=>{ await typing(600); inBub(`📧 I've sent a verification link to <b>${S.email}</b>. <span style="color:var(--txt-dim);font-size:12px">(Demo — auto-verified)</span>`); S.emailVerified=true; afterEmail(); })();
    return;
  }
  if(S.step==='code-create'){
    const code=t.replace(/[^\d]/g,'');
    if(code.length!==6){outBub('••••••');inBub2(`Your Axo Code must be exactly 6 digits. Choose a code you'll remember.`);return;}
    outBub('••••••'); // never echo the code
    (async()=>{ await createIdentity(code); afterCode(); })();
    return;
  }
  if(S.step==='tx-auth'){
    if(S._txAuth){ const digits=t.replace(/[^\d]/g,''); for(const d of digits) S._txAuth.feed(d); }
    return;
  }
  if(S.step==='fund-title'){
    if(t.trim().length<3){outBub(t);inBub2(`Please give your fundraiser a clear title.`);return;}
    S.fund.title=t.trim(); outBub(t); fundCreateTarget(); return;
  }
  if(S.step==='fund-target'){
    const n=parseFloat(t.replace(/[^\d.]/g,''));
    if(!n||n<1){outBub(t);inBub2(`Please enter a target amount, like 500.`);return;}
    S.fund.target=Math.round(n); outBub(t); fundReview(); return;
  }
  if(S.step==='verify-axoid'||S.step==='verify-email'||S.step==='verify-code'){ handleVerifyStep(t); return; }
  if(S.step==='new-number'){ handleNewNumber(t); return; }
  if(S.step==='req-note'){S.req.note=t;chat.querySelectorAll('.acts').forEach(a=>a.remove());outBub(t);reqConfirm();return;}
  if(S.step==='pay-paybill-code'){S.pay.code=t.replace(/\D/g,'');outBub(t);payAskAccount();return;}
  if(S.step==='pay-till-code'){S.pay.code=t.replace(/\D/g,'');outBub(t);payAskAmount();return;}
  if(S.step==='pay-account'){S.pay.account=t;outBub(t);payAskAmount();return;}
  outBub(t);
  if(!S.verified){ return fallback(); }

  const intent=classify(low);
  const amount=parseAmount(t);
  const asset=parseAsset(t);
  const who=matchContact(t);

  switch(intent){
    case 'insights': return insights();
    case 'paltas':   return paltasStart();
    case 'scan':     return payScan();
    case 'pay':      return payMenu();
    case 'save':     return saveFlow(amount);
    case 'withdraw':
      if(amount){ const pools=['USD','USDC','USDT'];const best=pools.reduce((a,b)=>(S.bal[b]||0)>(S.bal[a]||0)?b:a,'USD'); if(amount>(S.bal[best]||0)){ return withdrawStart(); } S.wd={amount,asset:best};
        (async()=>{await typing(500);inBub(`Finding agents who can pay you <b>${best==='USD'?'$':''}${fmt(amount)} ${best!=='USD'?best:''}</b> in cash near you…`);await withdrawBroadcast();})(); return; }
      return withdrawStart();
    case 'deposit':  return addMoneyStart();
    case 'fx':       return startConvert('fx');
    case 'swapdollar': return startConvert('dollar');
    case 'request':
      if(who&&amount){ S.req={from:who,amount,asset,note:''}; (async()=>{await typing(600);inBub(`Requesting <b>${asset==='USD'?'$':''}${fmt(amount)}</b> from <b>${who.n}</b>.`);reqConfirm();})(); return; }
      return requestStart();
    case 'receive':  return receiveStart();
    case 'send':
      if(who&&amount){ return smartSend(who,amount,asset); }
      if(who&&!amount){ return pickAmount(who); }
      return sendStart();
    case 'shop':         return shopStart();
    case 'fundraise':    return fundraiseStart();
    case 'recover':      return recoverStart();
    case 'lostphone':    return lostPhoneStart();
    case 'changenumber': return changeNumberStart();
    case 'security':      return securityMenu();
    case 'balance':  return (async()=>{await showBalance();mainMenu();})();
    case 'help':     return helpChat();
    default:         return fallback();
  }
}

/* ---- shared step-up verification (Axo ID + email + Axo Code + risk) ---- */
async function stepUpVerify(onSuccess, {context='this action'}={}){
  if(isLockedOut()){ await typing(400); inBub(`🔒 Too many attempts. Please wait ${lockoutRemaining()}s before trying again.`); return mainMenu(); }
  S._recover={ step:'axoid', onSuccess, context };
  await typing(500);
  inBub(`To protect ${context}, I need to verify it's really you. This can't be done with WhatsApp alone.<br><br>First, what's your <b>Axo ID</b>? (e.g. AXO-829374)`);
  S.step='verify-axoid';
  txt.focus();
}

async function recoverStart(){ outBub('Recover my Axo account'); seedDemoPendingClaim(); await beginRecovery('recovering your account'); }

/* Demo: put one piece of money "in flight" to the current number so the recovery
   walkthrough can show it being re-pointed. No-op if one already exists. */
function seedDemoPendingClaim(){

  if(S.pendingIn.some(p=>p.state==='unclaimed')) return;
  S.pendingIn.push({ id:'CLM-'+Math.floor(100000+Math.random()*900000), from:'Amran', amount:25, asset:'USD', toNumber:S.phone, state:'unclaimed', createdAt:Date.now() });
}

async function beginRecovery(context){
