/* recovery/verify input steps */
async function handleVerifyStep(t){
  const r=S._recover; if(!r) return;
  if(isLockedOut()){ inBub(`🔒 Locked. Wait ${lockoutRemaining()}s.`); S.step='menu'; return mainMenu(); }

  if(S.step==='verify-axoid'){
    outBub(t);
    const given=t.trim().toUpperCase().replace(/\s/g,'');
    if(given!==(S.axoId||'').toUpperCase()){
      registerFail();
      await typing(500);
      inBub(`That Axo ID doesn't match our records. ${attemptsLeft()} attempt${attemptsLeft()===1?'':'s'} left.`);
      if(isLockedOut()) inBub(`🔒 Too many attempts — locked for ${lockoutRemaining()}s.`);
      return;
    }
    r.step='email';
    await typing(500);inBub(`✅ Axo ID found. Now verify your <b>recovery email</b>.`);
    S.step='verify-email';return;
  }
  if(S.step==='verify-email'){
    outBub(t);
    if(t.trim().toLowerCase()!==(S.email||'').toLowerCase()){
      registerFail();
      await typing(500);inBub(`That email doesn't match the one on file. ${attemptsLeft()} attempt${attemptsLeft()===1?'':'s'} left.`);
      if(isLockedOut()) inBub(`🔒 Locked for ${lockoutRemaining()}s.`);
      return;
    }
    await typing(500);
    inBub(`📧 I've sent a verification code to <b>${S.email}</b>. <span style="color:var(--txt-dim);font-size:12px">(Demo — auto-verified)</span>`);
    r.step='code';
    await typing(400);inBub(`Now enter your <b>Axo Code</b> (6 digits).`);
    S.step='verify-code';return;
  }
  if(S.step==='verify-code'){
    outBub('••••••');
    const ok=await verifyCode(t.replace(/[^\d]/g,''));
    if(!ok){
      registerFail();
      await typing(500);inBub(`Incorrect Axo Code. ${attemptsLeft()} attempt${attemptsLeft()===1?'':'s'} left.`);
      if(isLockedOut()) inBub(`🔒 Too many failed attempts — locked for ${lockoutRemaining()}s. This protects your funds.`);
      return;
    }
    // passed Axo ID + email + Axo Code → risk step
    r.step='risk';
    await typing(600);
    inBub(`✅ Identity verified. Running a final <b>security check</b>…`);
    await typing(1200);
    inBub(`🛡️ Security check passed. <span style="color:var(--txt-dim);font-size:12px">(Demo — real build runs device/risk/KYT checks here)</span>`);
    resetAttempts();
    await finishVerification();
    return;
  }
}

async function finishVerification(){
  const r=S._recover; S._recover=null;
  if(r.isChange || r.isRecovery){
    // both change-number and recovery connect a NEW WhatsApp number
    await typing(500);
    inBub(`Now, what's the <b>new WhatsApp number</b> you want on this account?`);
    S._pendingNewNumber = { wasRecovery:r.isRecovery };
    S.step='new-number';
    txt.focus();
    return;
  }
  if(r.onSuccess){ await r.onSuccess(); }
}

/* Re-point unclaimed incoming money from the old number to the new one.
   In the real build this is a backend call (repointClaimsToNewNumber); here it
   moves the demo-tracked pending claims and returns a small summary. */
function repointPendingClaims(oldNum, newNum){
  if(!S.pendingIn) S.pendingIn=[];
  const moving = S.pendingIn.filter(p=>p.state==='unclaimed' && (!p.toNumber || p.toNumber===oldNum));
  moving.forEach(p=>{ p.toNumber=newNum; });
  const total = moving.reduce((a,p)=>a+(p.amount||0),0);
  const asset = moving[0]?.asset || 'USD';
  const summary = moving.length ? `${asset==='USD'?'$':''}${fmt(total)}${asset!=='USD'?' '+asset:''}` : '';
  return { count: moving.length, summary };
}

async function handleNewNumber(t){
  const digits=t.replace(/[^\d]/g,'');
  if(digits.length<7){ outBub(t); inBub2(`Please enter a valid number with country code.`); return; }
  const newNum = t.trim().startsWith('+') ? t.trim() : '+'+digits;
  const oldNum = S.phone;
  outBub(t);
  await typing(600);
  inBub(`📲 Verifying <b>${newNum}</b>… <span style="color:var(--txt-dim);font-size:12px">(Demo — real build sends OTP to new number)</span>`);
  await typing(1000);
  // THE CORE: revoke old sessions, disconnect old number, connect new — Axo ID unchanged
  revokeAllSessions();
  const preservedId=S.axoId, preservedBal={...S.bal};
  // Re-point any money still WAITING TO BE CLAIMED on the old number to the new
  // one — so a pending send follows the person, it isn't stranded on a number
  // they no longer control. Mirrors the backend repointClaimsToNewNumber().
  const repointed = repointPendingClaims(oldNum, newNum);
  S.phone=newNum;
  S.sessions=[ newSession('whatsapp') ];
  S.riskLock=true;  // protect sensitive actions after recovery/number change
  const repointRow = repointed.count>0
    ? `<div class="rr"><span>Pending money moved</span><span style="color:var(--axo-deep)">${repointed.count} transfer${repointed.count===1?'':'s'} · ${repointed.summary}</span></div>`
    : '';
  const c=document.createElement('div');c.className='card wide';
  c.innerHTML=`<div class="card-h">✅ Number updated</div><div class="card-b recpt">
    <div class="rr"><span>Axo ID</span><span style="letter-spacing:1px;color:var(--axo-deep);font-weight:700">${preservedId}</span></div>
    <div class="rr"><span>Old number</span><span style="text-decoration:line-through;color:var(--txt-dim)">${oldNum||'—'}</span></div>
    <div class="rr"><span>New number</span><span style="color:var(--axo-deep)">${newNum}</span></div>
    <div class="rr"><span>Old sessions</span><span>🚫 Revoked</span></div>
    <div class="rr"><span>Balance preserved</span><span>$${fmt(preservedBal.USD)} + wallet</span></div>
    ${repointRow}
  </div>`;
  raw(c);
  await typing(700);
  inBub(`Done. ✨ Your <b>Axo ID (${preservedId}) is unchanged</b>, all your money and history are intact, and old sessions are revoked.<br><br>🛡️ For your safety, sensitive actions (large sends, withdrawals) need extra verification for a short while after a number change.`);
  if(repointed.count>0){
    await typing(700);
    inBub(`💸 You also had <b>${repointed.count} payment${repointed.count===1?'':'s'}</b> (${repointed.summary}) still waiting to be claimed on your old number. ${repointed.count===1?'It has':'They have'} been <b>re-pointed to this account</b> — reply to the claim message here, or it'll land automatically. Nothing was lost.`);
  }
  S._pendingNewNumber=null;
  await mainMenu();
}

/* sensitive-action guard: after recovery/number-change, require step-up */
async function guardSensitive(actionName, proceed){
  if(!S.riskLock) return proceed();
  await typing(500);
  inBub(`🛡️ <b>${actionName}</b> is temporarily protected after your recent account change. Please verify your Axo Code to continue.`);
  return stepUpVerify(async()=>{ S.riskLock=false; await typing(400); inBub(`✅ Verified — protection lifted.`); proceed(); }, {context:actionName});
}

/* ============================================================
   TRANSACTION AUTHORIZATION (reuses the Axo Code)
   Required before money moves on Withdraw + sends above threshold.
   Biometric is a SIMULATED device prompt (real build = WebAuthn/Face ID).
   ============================================================ */
window.AXO_TX = { threshold: 100, appLock: false };  // authorize sends >= $100 and all withdrawals

function needsTxAuth(kind, amount, asset){
  // withdrawals always; sends/pays at or above threshold (USD-equivalent demo: treat all assets 1:1)
  if(kind==='withdraw') return true;
  if((amount||0) >= window.AXO_TX.threshold) return true;
  return false;
}

/* the in-chat authorization prompt — Axo Code, with a biometric shortcut */
function requestTxAuth(summary, onOk, onCancel){
  if(isLockedOut()){ inBub(`🔒 Too many attempts. Wait ${lockoutRemaining()}s before authorizing.`); return onCancel&&onCancel(); }
  const c=document.createElement('div');c.className='card wide';
  c.innerHTML=`<div class="card-h">🔐 Authorize payment</div><div class="card-b">
    <div class="recpt" style="margin-bottom:8px"><div class="rr"><span>${summary.label||'Amount'}</span><span class="big">${summary.value||''}</span></div>${summary.to?`<div class="rr"><span>To</span><span>${summary.to}</span></div>`:''}</div>
    <div class="txauth-hint">Enter your <b>Axo Code</b> to confirm this payment.</div>
    <div class="txpin" id="txPin"><span></span><span></span><span></span><span></span><span></span><span></span></div>
    <div class="txauth-err" id="txErr"></div>
    <button class="act" style="border-radius:9px;width:100%;margin-top:4px" id="txBio">👤 Use Face ID / fingerprint</button>
    <button class="act dim" style="border-radius:9px;width:100%;margin-top:2px" id="txCancel">Cancel</button>
    <div class="txauth-note">🔒 Your Axo Code is never shown or sent. This authorizes only this payment.</div>
  </div>`;
  const node=raw(c);
  let buf='';
  const pins=node.querySelectorAll('#txPin span');
  const err=node.querySelector('#txErr');
  function paint(){ pins.forEach((s,i)=>s.classList.toggle('on', i<buf.length)); }
  async function submit(){
    const ok=await verifyCode(buf);
    if(ok){ resetAttempts(); node.querySelector('#txPin').classList.add('ok'); setTimeout(()=>{ node.remove(); onOk(); }, 300); }
    else{
      registerFail(); buf=''; paint();
      node.querySelector('#txPin').classList.add('shake'); setTimeout(()=>node.querySelector('#txPin').classList.remove('shake'),400);
      err.textContent = isLockedOut() ? `🔒 Locked for ${lockoutRemaining()}s.` : `Incorrect code. ${attemptsLeft()} attempt${attemptsLeft()===1?'':'s'} left.`;
      if(isLockedOut()){ setTimeout(()=>{ node.remove(); onCancel&&onCancel(); }, 1200); }
    }
  }
  // capture digits via the chat input
  S._txAuth = { feed:(d)=>{ if(buf.length<6){ buf+=d; paint(); if(buf.length===6) submit(); } }, back:()=>{ buf=buf.slice(0,-1); paint(); } };
  node.querySelector('#txBio').onclick=async()=>{
    // SIMULATED biometric — real build uses WebAuthn platform authenticator
    err.textContent=''; node.querySelector('#txBio').textContent='👤 Verifying…';
    await new Promise(r=>setTimeout(r,900));
    resetAttempts(); node.querySelector('#txPin').classList.add('ok');
    setTimeout(()=>{ S._txAuth=null; node.remove(); onOk(); }, 300);
  };
  node.querySelector('#txCancel').onclick=()=>{ S._txAuth=null; node.remove(); onCancel&&onCancel(); };
  S.step='tx-auth';
  txt.focus();
}

/* ============================================================
   APP LOCK (optional) — reuses the Axo Code. Off by default.
   When enabled, opening/returning to Axo shows a lock screen.
   ============================================================ */
let _lockBuf='';
function renderLockKeys(){
  const keys=['1','2','3','4','5','6','7','8','9','','0','⌫'];
  document.getElementById('lockKeys').innerHTML=keys.map(k=>k?`<button class="lock-key ${k==='⌫'?'del':''}" data-k="${k}">${k}</button>`:`<span class="lock-key blank"></span>`).join('');
  document.getElementById('lockKeys').querySelectorAll('.lock-key[data-k]').forEach(b=>b.onclick=()=>lockKey(b.dataset.k));
}
function paintLock(){ document.querySelectorAll('#lockPin span').forEach((s,i)=>s.classList.toggle('on', i<_lockBuf.length)); }
async function lockKey(k){
  const err=document.getElementById('lockErr');
  if(k==='⌫'){ _lockBuf=_lockBuf.slice(0,-1); paintLock(); return; }
  if(_lockBuf.length>=6) return;
  _lockBuf+=k; paintLock();
  if(_lockBuf.length===6){
    if(isLockedOut()){ err.textContent=`Locked for ${lockoutRemaining()}s.`; _lockBuf=''; paintLock(); return; }
    const ok=await verifyCode(_lockBuf);
    if(ok){ resetAttempts(); unlockApp(); }
    else{ registerFail(); _lockBuf=''; paintLock(); const p=document.getElementById('lockPin'); p.classList.add('shake'); setTimeout(()=>p.classList.remove('shake'),400); err.textContent = isLockedOut()?`🔒 Locked for ${lockoutRemaining()}s.`:`Wrong code. ${attemptsLeft()} left.`; }
  }
}
function lockApp(){
  if(!window.AXO_TX.appLock || !S.codeHash) return;
  _lockBuf=''; paintLock();
  document.getElementById('lockErr').textContent='';
  renderLockKeys();
  document.getElementById('lockscreen').classList.add('on');
}
function unlockApp(){
  _lockBuf='';
  document.getElementById('lockscreen').classList.remove('on');
}
document.addEventListener('DOMContentLoaded',()=>{
  const bio=document.getElementById('lockBio');
  if(bio)bio.onclick=async()=>{ // SIMULATED biometric
    bio.textContent='👤 Verifying…';
    await new Promise(r=>setTimeout(r,900));
    resetAttempts(); unlockApp(); bio.textContent='👤 Unlock with Face ID';
  };
});
/* lock when the tab is hidden/backgrounded (like a real app) */
document.addEventListener('visibilitychange',()=>{ if(document.hidden && window.AXO_TX && window.AXO_TX.appLock && S.verified) lockApp(); });

txt.addEventListener('keydown',e=>{if(e.key==='Enter')fire();});
