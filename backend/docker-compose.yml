# Local dev services. `docker compose up -d` then set DATABASE_URL / REDIS_URL
# in .env to match, run `npm run prisma:migrate` and `npm run seed`.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: axo
      POSTGRES_PASSWORD: axo
      POSTGRES_DB: axo_business
    ports:
      - '5432:5432'
    volumes:
      - axo_pg:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - '6379:6379'

volumes:
  axo_pg:
